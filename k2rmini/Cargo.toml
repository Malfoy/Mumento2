[package]
name = "K2Rmini"
version = "0.1.0"
edition = "2024"

[lib]
name = "k2rmini"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
libc = "0.2"
helicase = { path = "../vendor/helicase", features = [
    "packed-seq", "xz",
] }
simd-minimizers = "2.3"
regex = "1.12"
rustc-hash = "2.1"
tempfile = "3.27"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
aho-corasick = "1"
flate2 = "1.1"
liblzma = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug-assertions = false

[profile.dev]
opt-level = 1
lto = "thin"
