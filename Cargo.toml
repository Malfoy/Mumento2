[package]
name = "mumento2"
version = "0.1.0"
edition = "2024"
description = "Native GGCAT shared proto-MUM construction and K2Rmini verification"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
k2rmini = { package = "K2Rmini", path = "k2rmini" }
tempfile = "3.27"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug-assertions = false

